<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卷积动画：真实猫图像（优化计算区）</title>
<style>
  :root{
    --bg:#f6f8fc;
    --card:#ffffffee;
    --line:#dde4ef;
    --ink:#1f2a44;
    --muted:#71809a;
    --accent:#5670ff;
    --accent2:#ff7a59;
    --soft:#eef2ff;
    --green:#14b37d;
    --shadow:0 16px 38px rgba(35,52,84,.09);
    --pixelBg:#f8fbff;
    --kernelBg:#fff8f2;
    --prodBg:#f6f3ff;
    --sumBg:#f8fafc;
    --resultBg:#effcf5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: Inter, "PingFang SC","Microsoft YaHei", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 0%, rgba(86,112,255,.08), transparent 33%),
      linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
  }
  .wrap{max-width:1360px;margin:0 auto;padding:22px 18px 30px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:14px}
  .title{font-size:30px;font-weight:900;letter-spacing:-.03em}
  .mini{font-size:12px;color:var(--muted)}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:12px 14px;box-shadow:0 8px 24px rgba(35,52,84,.06);margin-bottom:16px;
  }
  .toolbar .group{display:flex;align-items:center;gap:8px}
  .toolbar label{font-size:13px;color:#44516c;font-weight:700}
  select, button, input[type=range]{border:1px solid var(--line);border-radius:12px;font-size:14px}
  select{padding:10px 12px;background:white;color:var(--ink);font-weight:800}
  button{padding:10px 14px;background:var(--ink);color:white;font-weight:800;cursor:pointer}
  button.secondary{background:#eef2f7;color:#344054}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#44516c}
  .switch input{transform:scale(1.15)}
  input[type=range]{accent-color:var(--accent)}
  .main{display:grid;grid-template-columns:minmax(280px,1fr) 470px minmax(280px,1fr);gap:16px;align-items:start}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:14px;
  }
  .cardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cardHead h3{margin:0;font-size:16px}
  .hint{font-size:12px;color:var(--muted)}
  .canvasWrap{
    position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    border:1px solid #dfe6f0;background:#edf1f7;
  }
  canvas{width:100%;height:100%;display:block}
  #scanBox{
    position:absolute;border:3px solid var(--accent2);border-radius:6px;pointer-events:none;
    box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(255,122,89,.25);
    transform:translate(-50%,-50%);
  }
  #scanDot{
    position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;border-radius:999px;
    background:var(--accent2);box-shadow:0 0 0 3px rgba(255,255,255,.85);
  }
  .progress{height:10px;background:#e9eef6;border-radius:999px;overflow:hidden;margin-top:12px}
  #bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7f56d9)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{border:1px solid #e5eaf2;border-radius:14px;background:#f9fbff;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:18px;margin-bottom:3px}
  .stat span{font-size:11px;color:var(--muted)}
  .subnote{
    margin-top:10px;padding:10px 12px;border-radius:12px;background:#f9fbff;border:1px solid #e6edf8;
    font-size:12px;color:#526079;line-height:1.45;
  }

  .centerPanel{display:flex;flex-direction:column;gap:12px}
  .mathToggleHidden .matrixZone{display:none}
  .opTitle{
    display:flex;align-items:center;justify-content:center;gap:8px;
    text-align:center;padding:12px;border-radius:16px;background:#f7f9ff;border:1px solid #e4e9ff;
    font-size:18px;font-weight:900;color:#3853d8;
  }
  .opBadge{
    font-size:11px;font-weight:800;color:#6b7aa0;background:#fff;border:1px solid #dce4ff;border-radius:999px;
    padding:5px 9px;
  }

  .matrixZone{display:flex;flex-direction:column;gap:12px}
  .calcGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .box{
    border:1px solid #e3e8f2;border-radius:18px;padding:12px;background:white;
  }
  .box.pixelBox{background:var(--pixelBg)}
  .box.kernelBox{background:var(--kernelBg)}
  .box.prodBox{background:var(--prodBg)}
  .box.sumBox{background:var(--sumBg)}
  .boxTitle{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    font-size:13px;font-weight:900;color:#41506b;
  }
  .boxTitle span{
    font-size:11px;color:var(--muted);font-weight:700;
  }
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cell{
    border-radius:14px;border:1px solid #d7dfea;background:#fff;
    min-height:70px;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:950;letter-spacing:-.04em;color:#24324d;
  }
  .cell.center{box-shadow:inset 0 0 0 2px rgba(86,112,255,.25);border-color:#b8c5ff}
  .pixelCell.center{background:#eef4ff;color:#334fd6}
  .kernelCell{background:#fffdf8;color:#9a4e17}
  .kernelCell.center{background:#fff1df;color:#bd5d16}
  .prodCell{
    min-height:76px;flex-direction:column;padding:6px 2px;background:#fbfaff;
  }
  .prodCell .topNum{
    font-size:26px;font-weight:950;line-height:1;color:#5337cc;
  }
  .prodCell .small{
    margin-top:4px;font-size:12px;font-weight:800;color:#7b6fc0;
  }

  .sumRow{
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  }
  .sumLeft{
    padding:12px 14px;border-radius:16px;background:white;border:1px solid #e4e8f0;
  }
  .sumLabel{
    font-size:12px;color:#73829b;font-weight:800;margin-bottom:6px;
  }
  .sumValue{
    font-size:28px;font-weight:950;color:#344054;letter-spacing:-.04em;
  }
  .resultRight{
    min-width:140px;padding:14px 16px;border-radius:18px;background:var(--resultBg);
    border:1px solid #cfeedd;text-align:center;
  }
  .resultRight .label{
    font-size:12px;font-weight:800;color:#4c7c64;margin-bottom:5px;
  }
  .resultRight .value{
    font-size:40px;font-weight:1000;color:var(--green);line-height:1;
    letter-spacing:-.05em;
  }
  .flowChips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    padding:9px 12px;border-radius:999px;background:#fff;border:1px solid #dfe5ef;
    font-size:16px;font-weight:900;color:#314161;
  }
  .chip b{color:#3c56de}
  .foot{
    margin-top:8px;text-align:center;font-size:12px;color:var(--muted)
  }
  .miniGrayLegend{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:12px;color:#66738c
  }
  .graySwatch{
    width:16px;height:16px;border-radius:4px;border:1px solid #d8dfeb;
    background:linear-gradient(90deg,#222,#eee);
  }
  @media (max-width: 1120px){
    .main{grid-template-columns:1fr}
  }
  @media (max-width: 620px){
    .calcGrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">卷积动画 · 真实猫图像</div>
    <div class="mini">优化版：计算区分层显示</div>
  </div>

  <div class="toolbar">
    <div class="group">
      <label for="kernelSel">算子</label>
      <select id="kernelSel">
        <option value="identity">原图</option>
        <option value="blur">模糊</option>
        <option value="sharpen" selected>清晰</option>
        <option value="edge">边缘</option>
        <option value="emboss">风格</option>
      </select>
    </div>

    <div class="group">
      <button id="playBtn">暂停</button>
      <button id="resetBtn" class="secondary">重置</button>
      <button id="stepBtn" class="secondary">单步</button>
    </div>

    <div class="group">
      <label for="speed">速度</label>
      <input id="speed" type="range" min="1" max="120" value="38">
    </div>

    <label class="switch">
      <input id="showMath" type="checkbox" checked />
      显示数值
    </label>
  </div>

  <div class="main">
    <section class="card">
      <div class="cardHead">
        <h3>输入</h3>
        <div class="hint" id="xyText">x=0, y=0</div>
      </div>
      <div class="canvasWrap">
        <canvas id="inputCanvas"></canvas>
        <div id="scanBox"><div id="scanDot"></div></div>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="stats">
        <div class="stat"><b id="stepCount">0</b><span>已计算</span></div>
        <div class="stat"><b>3×3</b><span>窗口</span></div>
        <div class="stat"><b id="speedText">×1.0</b><span>速度</span></div>
      </div>
      <div class="subnote">左边显示的是<b>彩色原图</b>；中间卷积计算使用的是它转换后的<b>灰度值</b>。</div>
    </section>

    <section class="card centerPanel" id="mathPanel">
      <div class="opTitle">
        <span id="opName">清晰</span>
        <span class="opBadge">灰度卷积</span>
      </div>

      <div class="matrixZone">
        <div class="calcGrid">
          <div class="box pixelBox">
            <div class="boxTitle">当前 3×3 灰度窗口 <span>参与计算的像素值</span></div>
            <div class="grid3" id="pixelGrid"></div>
          </div>

          <div class="box kernelBox">
            <div class="boxTitle">当前算子 <span>每个位置的权重</span></div>
            <div class="grid3" id="kernelGrid"></div>
          </div>

          <div class="box prodBox" style="grid-column:1 / -1;">
            <div class="boxTitle">逐项乘积 <span>像素值 × 权重</span></div>
            <div class="grid3" id="productGrid"></div>
          </div>

          <div class="box sumBox" style="grid-column:1 / -1;">
            <div class="sumRow">
              <div class="sumLeft">
                <div class="sumLabel">先求和 / 再做后处理</div>
                <div class="sumValue" id="sumText">Σ = 0</div>
                <div class="flowChips" id="extras"></div>
              </div>
              <div class="resultRight">
                <div class="label">写入输出图</div>
                <div class="value" id="resultText">0</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="miniGrayLegend"><span class="graySwatch"></span><span>所有数值均为灰度值 0–255</span></div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h3>输出</h3>
        <div class="hint" id="percentText">0%</div>
      </div>
      <div class="canvasWrap">
        <canvas id="outputCanvas"></canvas>
      </div>
    </section>
  </div>
</div>

  const N = 96;
  const inputCanvas = document.getElementById('inputCanvas');
  const outputCanvas = document.getElementById('outputCanvas');
  const ictx = inputCanvas.getContext('2d', {willReadFrequently:true});
  const octx = outputCanvas.getContext('2d');
  inputCanvas.width = outputCanvas.width = N;
  inputCanvas.height = outputCanvas.height = N;

  const work = document.createElement('canvas');
  work.width = work.height = N;
  const wctx = work.getContext('2d', {willReadFrequently:true});

  const pixelGrid = document.getElementById('pixelGrid');
  const kernelGrid = document.getElementById('kernelGrid');
  const productGrid = document.getElementById('productGrid');
  const scanBox = document.getElementById('scanBox');
  const xyText = document.getElementById('xyText');
  const percentText = document.getElementById('percentText');
  const stepCount = document.getElementById('stepCount');
  const speedText = document.getElementById('speedText');
  const bar = document.getElementById('bar');
  const sumText = document.getElementById('sumText');
  const resultText = document.getElementById('resultText');
  const extras = document.getElementById('extras');
  const opName = document.getElementById('opName');
  const mathPanel = document.getElementById('mathPanel');

  const kernelSel = document.getElementById('kernelSel');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stepBtn = document.getElementById('stepBtn');
  const speed = document.getElementById('speed');
  const showMath = document.getElementById('showMath');

  for (let i=0;i<9;i++) {
    const a = document.createElement('div');
    a.className = 'cell pixelCell' + (i===4 ? ' center' : '');
    a.textContent = '0';
    pixelGrid.appendChild(a);

    const b = document.createElement('div');
    b.className = 'cell kernelCell' + (i===4 ? ' center' : '');
    b.textContent = '0';
    kernelGrid.appendChild(b);

    const c = document.createElement('div');
    c.className = 'cell prodCell' + (i===4 ? ' center' : '');
    c.innerHTML = '<div class="topNum">0</div><div class="small">0 × 0</div>';
    productGrid.appendChild(c);
  }

  const pixelCells = [...pixelGrid.children];
  const kernelCells = [...kernelGrid.children];
  const productCells = [...productGrid.children];

  const kernels = {
    identity: { name:'原图',  k:[0,0,0,0,1,0,0,0,0], divisor:1,  bias:0,   abs:false },
    blur:     { name:'模糊',  k:[1,2,1,2,4,2,1,2,1], divisor:16, bias:0,   abs:false },
    sharpen:  { name:'清晰',  k:[0,-1,0,-1,5,-1,0,-1,0], divisor:1, bias:0, abs:false },
    edge:     { name:'边缘',  k:[-1,-1,-1,-1,8,-1,-1,-1,-1], divisor:1, bias:0, abs:true },
    emboss:   { name:'风格',  k:[-2,-1,0,-1,1,1,0,1,2], divisor:1, bias:128, abs:false }
  };

  let gray = new Uint8ClampedArray(N*N);
  let out = new Uint8ClampedArray(N*N);
  let step = 0;
  let playing = true;
  let loaded = false;

  function clamp(v) {
    return Math.max(0, Math.min(255, Math.round(v)));
  }

  function formatNum(n) {
    return n < 0 ? '−' + Math.abs(n) : String(n);
  }

  function drawOutputBase() {
    octx.fillStyle = '#eef2f7';
    octx.fillRect(0,0,N,N);
  }

  function initPhoto() {
    const img = new Image();
    img.onload = () => {
      wctx.clearRect(0,0,N,N);
      wctx.drawImage(img, 0, 0, N, N);
      ictx.clearRect(0,0,N,N);
      ictx.drawImage(img, 0, 0, N, N);

      const data = wctx.getImageData(0,0,N,N).data;
      for (let i=0, p=0; i<data.length; i+=4, p++) {
        gray[p] = Math.round(0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]);
      }
      loaded = true;
      recompute();
      animate();
    };
    img.src = IMG_SRC;
  }

  function getGray(x,y) {
    x = Math.max(0, Math.min(N-1, x));
    y = Math.max(0, Math.min(N-1, y));
    return gray[y*N + x];
  }

  function convolveAt(x,y, spec) {
    const vals = [
      getGray(x-1,y-1), getGray(x,y-1), getGray(x+1,y-1),
      getGray(x-1,y),   getGray(x,y),   getGray(x+1,y),
      getGray(x-1,y+1), getGray(x,y+1), getGray(x+1,y+1)
    ];
    const prods = vals.map((v, i) => v * spec.k[i]);
    let sum = prods.reduce((a,b)=>a+b,0);
    let shown = sum;
    if (spec.abs) shown = Math.abs(shown);
    let adjusted = shown / spec.divisor + spec.bias;
    const result = clamp(adjusted);
    return {vals, prods, sum, shown, adjusted, result};
  }

  function recompute() {
    if (!loaded) return;
    const spec = kernels[kernelSel.value];
    opName.textContent = spec.name;
    kernelCells.forEach((c, i) => c.textContent = formatNum(spec.k[i]));
    for (let y=0; y<N; y++) {
      for (let x=0; x<N; x++) {
        out[y*N+x] = convolveAt(x,y,spec).result;
      }
    }
    reset(false);
  }

  function reset(keepPlay=true) {
    step = 0;
    if (!keepPlay) playing = true;
    playBtn.textContent = '暂停';
    drawOutputBase();
    renderUI();
  }

  function writePixel(p) {
    const x = p % N;
    const y = Math.floor(p / N);
    const v = out[p];
    octx.fillStyle = `rgb(${v},${v},${v})`;
    octx.fillRect(x, y, 1, 1);
  }

  function renderMath(x,y) {
    const spec = kernels[kernelSel.value];
    const c = convolveAt(x,y,spec);

    c.vals.forEach((v, i) => {
      pixelCells[i].textContent = v;
      productCells[i].innerHTML = `<div class="topNum">${formatNum(c.prods[i])}</div><div class="small">${v} × ${formatNum(spec.k[i])}</div>`;
    });

    sumText.textContent = `Σ = ${formatNum(c.sum)}`;

    const chips = [];
    if (spec.abs) chips.push(`<div class="chip"><b>|Σ|</b> = ${formatNum(c.shown)}</div>`);
    if (spec.divisor !== 1) chips.push(`<div class="chip"><b>÷</b> ${spec.divisor}</div>`);
    if (spec.bias !== 0) chips.push(`<div class="chip"><b>+</b> ${spec.bias}</div>`);
    if (!spec.abs && spec.divisor === 1 && spec.bias === 0) {
      chips.push(`<div class="chip"><b>直接写入</b></div>`);
    }
    extras.innerHTML = chips.join('');
    resultText.textContent = c.result;
  }

  function renderUI() {
    const p = Math.min(step, N*N - 1);
    const x = p % N;
    const y = Math.floor(p / N);

    const xPct = (x + 0.5) / N * 100;
    const yPct = (y + 0.5) / N * 100;
    scanBox.style.left = xPct + '%';
    scanBox.style.top = yPct + '%';
    scanBox.style.width = `calc(${(3/N)*100}% + 8px)`;
    scanBox.style.height = `calc(${(3/N)*100}% + 8px)`;

    xyText.textContent = `x=${x}, y=${y}`;
    const pct = Math.min(100, step / (N*N) * 100);
    percentText.textContent = pct.toFixed(0) + '%';
    bar.style.width = pct + '%';
    stepCount.textContent = step.toLocaleString();
    speedText.textContent = '×' + (Number(speed.value)/38).toFixed(1);

    if (showMath.checked) {
      mathPanel.classList.remove('mathToggleHidden');
      renderMath(x,y);
    } else {
      mathPanel.classList.add('mathToggleHidden');
    }
  }

  function singleStep() {
    if (step >= N*N) return;
    writePixel(step);
    step++;
    renderUI();
    if (step >= N*N) {
      playing = false;
      playBtn.textContent = '播放';
    }
  }

  function animate() {
    function loop() {
      if (playing && loaded && step < N*N) {
        const batch = Number(speed.value);
        const target = Math.min(N*N, step + batch);
        while (step < target) {
          writePixel(step);
          step++;
        }
        renderUI();
        if (step >= N*N) {
          playing = false;
          playBtn.textContent = '播放';
        }
      }
      requestAnimationFrame(loop);
    }
    loop();
  }

  kernelSel.addEventListener('change', recompute);
  showMath.addEventListener('change', renderUI);
  speed.addEventListener('input', renderUI);

  playBtn.addEventListener('click', () => {
    if (step >= N*N) {
      reset(false);
      return;
    }
    playing = !playing;
    playBtn.textContent = playing ? '暂停' : '播放';
  });

  resetBtn.addEventListener('click', () => reset(false));

  stepBtn.addEventListener('click', () => {
    playing = false;
    playBtn.textContent = '播放';
    singleStep();
  });

  initPhoto();
})();
</script>
</body>
</html>
